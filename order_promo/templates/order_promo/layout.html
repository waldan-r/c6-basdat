<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title|default:"TakTikTuk" }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f9fafb; color: #1f2937; font-family: 'Segoe UI', Tahoma, sans-serif; }
        .card { border: 1px solid #e5e7eb; border-radius: 8px; box-shadow: 0 1px 2px rgba(0,0,0,.03); }
        .page-title { font-size: 1.875rem; font-weight: 800; }
        .section-title { font-size: 1.25rem; font-weight: 700; }
        .caption { color: #6b7280; font-size: .75rem; font-weight: 700; letter-spacing: 0; text-transform: uppercase; }
    </style>
</head>
<body>
{% include 'navbar.html' %}

<main class="container pb-5">
    {% block content %}{% endblock %}
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
